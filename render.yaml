services:
  - type: web
    name: mystore3
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:$PORT mystore.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mystore.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
